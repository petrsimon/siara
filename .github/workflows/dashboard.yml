name: Publish dashboard

# Builds the Siara dashboard from the committed *encrypted* fairness log
# (data.enc — real reviewer names, so never committed in the clear), encrypts the
# rendered page with StatiCrypt (client-side AES via a shared password), and
# deploys it to GitHub Pages. No `gh` auth or team config is needed — CI decrypts
# data.enc with the SIARA_LOG_KEY secret and reads only that log.

on:
  # Rebuild whenever the encrypted log changes on main.
  push:
    branches: [main]
    paths:
      - "data.enc"
      - "src/dashboard/**"
      - ".github/workflows/dashboard.yml"
  # Daily refresh so "age"/trend metrics stay current even with no new commits.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let a newer run cancel a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Decrypt fairness log
        env:
          SIARA_LOG_KEY: ${{ secrets.SIARA_LOG_KEY }}
        run: |
          if [ -z "$SIARA_LOG_KEY" ]; then
            echo "::error::SIARA_LOG_KEY secret is not set. Add it in repo Settings → Secrets → Actions (same passphrase used by 'npm run publish-log')." >&2
            exit 1
          fi
          ./scripts/log-crypt.sh decrypt

      - name: Generate dashboard
        run: npm run dashboard

      - name: Encrypt dashboard (StatiCrypt)
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::error::DASHBOARD_PASSWORD secret is not set. Add it in repo Settings → Secrets → Actions." >&2
            exit 1
          fi
          # StatiCrypt v3: encrypt in place (output dir == source dir).
          npx --yes staticrypt@3 public/index.html \
            --password "$DASHBOARD_PASSWORD" \
            --short \
            --directory public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
